name: ECR

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:
    inputs:
      ref:
        description: '`sei-chain` git ref (branch, tag, or commit)'
        required: true
        type: string
      tag:
        description: 'Custom Docker tag (optional; defaults to ref/sha)'
        required: false
        type: string

jobs:
  publisher:
    name: Publish Container
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # Required for GitHub OIDC token generation
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0   # Optional: useful if build needs git history

      - name: AWS Login (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::189176372795:role/common/gha
          role-duration-seconds: 900
          audience: sts.amazonaws.com   # Explicit audience (recommended)

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push seid with mock balances
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile   # Add if your repo has a non-default Dockerfile name
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/sei/build-cache:shared
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/sei/build-cache:shared,mode=max
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/sei/sei-chain:mock-${{ inputs.tag || inputs.ref || github.sha }}
          build-args: |
            SEI_CHAIN_REF=${{ inputs.ref || github.sha }}
            SEI_CHAIN_BUILD_TAGS=mock_balances

      - name: Build and push standard seid
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/sei/build-cache:shared
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/sei/build-cache:shared,mode=max
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/sei/sei-chain:${{ inputs.tag || inputs.ref || github.sha }}
          build-args: |
            SEI_CHAIN_REF=${{ inputs.ref || github.sha }}
