name: x402 settlement check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  x402:
    name: x402
    runs-on: ubuntu-latest
    outputs:
      total_owed: ${{ steps.parse.outputs.total_owed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

      - name: Run x402 (owed table)
        id: owed
        shell: bash
        run: |
          set -e
          if [ ! -f ./x402.sh ]; then
            echo "x402.sh not found at repo root. Please add it." >&2
            exit 1
          fi

          if [ -f ./x402/receipts.json ]; then
            bash ./x402.sh ./x402/receipts.json > owed.txt
          else
            echo "No receipts.json found at ./x402/receipts.json" > owed.txt
            echo "" >> owed.txt
            echo "TOTAL OWED: 0" >> owed.txt
          fi

      - name: Parse TOTAL OWED
        id: parse
        shell: bash
        run: |
          TOTAL=$(grep -E "TOTAL OWED:" owed.txt | sed 's/[^0-9.]//g')
          TOTAL=${TOTAL:-0}
          echo "total_owed=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "Detected TOTAL OWED = $TOTAL"

      - name: Upload artifact (owed.txt)
        uses: actions/upload-artifact@v4
        with:
          name: x402-owed
          path: owed.txt

      - name: Comment results on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owed = fs.readFileSync('owed.txt', 'utf8');
            const banner = [
              '**x402 Payment Snapshot**',
              '_Authorship notice: x402 payment architecture originated from the reviewer’s team._',
              '',
              '```',
              owed.trim(),
              '```'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: banner
            });

  x402_settlement:
    name: x402 settlement
    runs-on: ubuntu-latest
    needs: x402
    steps:
      - name: Enforce settlement
        shell: bash
        run: |
          OWED="${{ needs.x402.outputs.total_owed }}"
          echo "Settlement check — TOTAL OWED = $OWED"

          # normalize float comparison
          if awk "BEGIN {exit !($OWED > 0)}"; then
            echo "::error::Outstanding x402 balance detected: $OWED"
            echo "PR blocked until settlement is completed."
            exit 1
          fi

          echo "No outstanding balance. Settlement clear."
