[package]
name = "zeta-omega-singularity-max"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "zeta_singularity"
crate-type = ["staticlib", "rlib"]

[dependencies]
rayon = { version = "1.8", optional = true }
ed25519-dalek = { version = "2.2", default-features = false, features = ["rand_core", "std"] }
rand = "0.8"

[features]
default = ["parallel"]
parallel = ["rayon"]

